sprinkle_station_x_for_y_minutes:
  description: "Manually water a single station for a given number of minutes."
  fields:
    device_mac:
      description: "MAC address of the Solem controller (e.g. AA:BB:CC:DD:EE:FF)."
      required: true
      example: "AA:BB:CC:DD:EE:FF"
    station:
      description: "Station number (1–16)."
      required: true
      example: 1
    minutes:
      description: "Duration in minutes (1–240)."
      required: true
      example: 10
    bluetooth_timeout:
      description: "BLE connection timeout in seconds (optional, default 15)."
      required: false
      example: 15

sprinkle_all_stations_for_y_minutes:
  description: "Manually water all stations for a given number of minutes each."
  fields:
    device_mac:
      description: "MAC address of the Solem controller."
      required: true
      example: "AA:BB:CC:DD:EE:FF"
    minutes:
      description: "Duration in minutes per station (1–240)."
      required: true
      example: 10
    bluetooth_timeout:
      description: "BLE connection timeout in seconds (optional, default 15)."
      required: false
      example: 15

stop_manual_sprinkle:
  description: "Stop any manually started irrigation immediately."
  fields:
    device_mac:
      description: "MAC address of the Solem controller."
      required: true
      example: "AA:BB:CC:DD:EE:FF"
    bluetooth_timeout:
      description: "BLE connection timeout in seconds (optional, default 15)."
      required: false
      example: 15

turn_on:
  description: "Re-enable the controller after it was turned off."
  fields:
    device_mac:
      description: "MAC address of the Solem controller."
      required: true
      example: "AA:BB:CC:DD:EE:FF"
    bluetooth_timeout:
      description: "BLE connection timeout in seconds (optional, default 15)."
      required: false
      example: 15

turn_off_permanent:
  description: "Permanently disable all watering on the controller."
  fields:
    device_mac:
      description: "MAC address of the Solem controller."
      required: true
      example: "AA:BB:CC:DD:EE:FF"
    bluetooth_timeout:
      description: "BLE connection timeout in seconds (optional, default 15)."
      required: false
      example: 15

turn_off_x_days:
  description: "Suspend watering for a given number of days."
  fields:
    device_mac:
      description: "MAC address of the Solem controller."
      required: true
      example: "AA:BB:CC:DD:EE:FF"
    days:
      description: "Number of days to suspend (1–365)."
      required: true
      example: 7
    bluetooth_timeout:
      description: "BLE connection timeout in seconds (optional, default 15)."
      required: false
      example: 15

run_program_x:
  description: "Run a stored controller program by its number."
  fields:
    device_mac:
      description: "MAC address of the Solem controller."
      required: true
      example: "AA:BB:CC:DD:EE:FF"
    program:
      description: "Program number (1–3)."
      required: true
      example: 1
    bluetooth_timeout:
      description: "BLE connection timeout in seconds (optional, default 15)."
      required: false
      example: 15

request_status:
  description: "Read the current BLE status packet from the controller and return it."
  fields:
    device_mac:
      description: "MAC address of the Solem controller."
      required: true
      example: "AA:BB:CC:DD:EE:FF"
    bluetooth_timeout:
      description: "BLE connection timeout in seconds (optional, default 15)."
      required: false
      example: 15

list_characteristics:
  description: "List all GATT services and characteristics exposed by the controller (debug helper)."
  fields:
    device_mac:
      description: "MAC address of the Solem controller."
      required: true
      example: "AA:BB:CC:DD:EE:FF"
    bluetooth_timeout:
      description: "BLE connection timeout in seconds (optional, default 15)."
      required: false
      example: 15
